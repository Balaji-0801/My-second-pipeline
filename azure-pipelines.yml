- task: PowerShell@2
  displayName: 'Test VMware Aria Connectivity'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Agent Name: $env:AGENT_NAME"
      Write-Host "Machine Name: $env:COMPUTERNAME"

      Write-Host "==============================="
      Write-Host "Testing DNS Resolution"
      Write-Host "==============================="

      try {
          nslookup srv01vra1.corp.trumpf.com
      }
      catch {
          Write-Host "DNS lookup failed"
      }

      Write-Host "==============================="
      Write-Host "Testing HTTPS Connectivity"
      Write-Host "==============================="

      try {
          Test-NetConnection srv01vra1.corp.trumpf.com -Port 443
      }
      catch {
          Write-Host "Connection test failed"
      }

      Write-Host "==============================="
      Write-Host "Testing Web Request"
      Write-Host "==============================="

      try {
          Invoke-WebRequest `
            -Uri "https://srv01vra1.corp.trumpf.com" `
            -UseBasicParsing `
            -TimeoutSec 30

          Write-Host "VMware Aria URL reachable"
      }
      catch {
          Write-Host "ERROR:"
          Write-Host $_.Exception.Message
      }